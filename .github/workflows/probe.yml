name: Investigate actual Pharos Morpho Blue markets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install ethers@6 --no-save --no-audit --no-fund
      - run: node scripts/probe-markets.mjs
      - run: node scripts/probe-positions.mjs
